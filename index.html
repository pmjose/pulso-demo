<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PULSO · Acesso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;500;700&display=swap" rel="stylesheet">
<style>
  :root{--night:#06122b;--deep:#0b2350;--beam:#9fe8e4;--sun:#ffd27a;--ink:#e9f1ff}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--night);color:var(--ink);font-family:Sora,system-ui,sans-serif}
  canvas{position:fixed;inset:0;width:100%;height:100%}
  .vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 30%,rgba(3,8,22,.85) 100%)}
  main{position:relative;z-index:2;height:100%;display:grid;place-items:center;text-align:center;padding:24px}
  .stack{display:flex;flex-direction:column;align-items:center;gap:28px;opacity:0;transform:translateY(12px);transition:opacity 1.6s ease,transform 1.6s ease}
  .stack.on{opacity:1;transform:none}
  h1{font-weight:200;font-size:clamp(56px,11vw,148px);letter-spacing:.32em;margin-right:-.32em;line-height:1;
     background:linear-gradient(180deg,#fff 20%,var(--beam) 70%,var(--sun));-webkit-background-clip:text;background-clip:text;color:transparent;
     filter:drop-shadow(0 0 24px rgba(159,232,228,.35))}
  .sub{font-weight:300;font-size:clamp(14px,1.6vw,18px);color:#b8c9e8;max-width:46ch;line-height:1.6}
  form{display:flex;gap:10px;align-items:center;margin-top:8px}
  .field{position:relative}
  input{width:260px;padding:15px 20px;border-radius:999px;border:1px solid rgba(159,232,228,.35);background:rgba(10,30,70,.45);
        color:#fff;font:inherit;font-size:15px;letter-spacing:.18em;text-align:center;outline:none;backdrop-filter:blur(10px);transition:border-color .3s, box-shadow .3s}
  input::placeholder{color:#7f93b8;letter-spacing:.06em}
  input:focus{border-color:var(--beam);box-shadow:0 0 0 4px rgba(159,232,228,.15),0 0 40px rgba(159,232,228,.25)}
  button{padding:15px 26px;border-radius:999px;border:0;background:linear-gradient(135deg,var(--beam),#6fc9ff);color:#04203a;font:inherit;font-weight:500;font-size:15px;cursor:pointer;transition:transform .2s, box-shadow .3s}
  button:hover{transform:translateY(-1px);box-shadow:0 10px 40px rgba(111,201,255,.4)}
  button:focus-visible,input:focus-visible{outline:2px solid var(--sun);outline-offset:3px}
  .msg{height:20px;font-size:13px;color:#ffb4a8;font-weight:300}
  .hint{font-size:12px;color:#6c80a6;font-weight:300}
  .hint b{color:#b8c9e8;font-weight:500;letter-spacing:.12em}
  .shake{animation:shake .45s}
  @keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  .flash{position:fixed;inset:0;z-index:5;background:radial-gradient(circle at 50% 50%,#fff,var(--beam) 30%,transparent 70%);opacity:0;pointer-events:none;transition:opacity .9s ease}
  .flash.go{opacity:1}
  footer{position:fixed;bottom:18px;left:0;right:0;text-align:center;font-size:11px;color:#4f6390;z-index:2;font-weight:300}
  @media (max-width:560px){form{flex-direction:column}input{width:240px}}
  @media (prefers-reduced-motion:reduce){.stack{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="vignette"></div>
<main>
  <div class="stack" id="stack">
    <h1>PULSO</h1>
    <p class="sub">Plataforma de inteligência clínica e operacional. Dados, previsão e IA ao serviço de quem cuida.</p>
    <form id="f" autocomplete="off">
      <div class="field"><input id="code" aria-label="Código de acesso" placeholder="Código de acesso" maxlength="16"></div>
      <button type="submit">Entrar</button>
    </form>
    <div class="msg" id="msg" role="status"></div>
  </div>
</main>
<div class="flash" id="flash"></div>
<footer>Acesso reservado a utilizadores autorizados. Todos os dados apresentados são fictícios.</footer>
<script>
(() => {
  const c = document.getElementById('c'), x = c.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, dpr, t0 = performance.now(), parts = [], stars = [];
  function size(){
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = c.width = innerWidth * dpr; H = c.height = innerHeight * dpr;
    stars = Array.from({length: 180}, () => ({x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.4*dpr, p: Math.random()*6.28}));
  }
  size(); addEventListener('resize', size);

  // ECG shape over one beat, input u in [0,1)
  function ecg(u){
    const g = (m, s, a) => a * Math.exp(-((u-m)**2)/(2*s*s));
    return g(.18,.025,.12) - g(.36,.008,.14) + g(.40,.012,1) - g(.44,.01,.28) + g(.66,.04,.22);
  }

  let mouse = {x: -1e4, y: -1e4};
  addEventListener('pointermove', e => { mouse.x = e.clientX*dpr; mouse.y = e.clientY*dpr; });

  let unlocking = 0;
  function frame(now){
    const t = (now - t0) / 1000;
    x.globalCompositeOperation = 'source-over';
    x.fillStyle = 'rgba(6,18,43,0.22)'; x.fillRect(0,0,W,H);

    // stars
    for (const s of stars){
      const a = .25 + .25*Math.sin(t*1.3 + s.p);
      x.fillStyle = `rgba(184,214,255,${a})`; x.beginPath(); x.arc(s.x, s.y, s.r, 0, 6.28); x.fill();
    }

    x.globalCompositeOperation = 'lighter';
    const mid = H*0.8, amp = H*0.12, speed = .55; // sweep fraction per second
    const head = (t*speed) % 1.25;               // sweep position (overshoot for pause)
    const beats = 3.2;
    // trail of the ECG line: fine-resolution stroked segments fading with age
    const N = Math.ceil(W / (2*dpr)), seg = 6;
    const yAt = f => mid - ecg((f*beats) % 1)*amp*(1+unlocking*2);
    x.globalCompositeOperation = 'source-over'; x.lineCap = 'round'; x.lineJoin = 'round';
    for (let i = 0; i < N; i += seg){
      const f0 = i / N; if (f0 > head) break;
      const alpha = Math.max(0, 1 - (head - f0)*1.4);
      if (alpha <= 0) continue;
      x.beginPath();
      for (let k = 0; k <= seg; k++){ const f = Math.min(head, (i+k)/N); const px = f*W, py = yAt(f); k ? x.lineTo(px,py) : x.moveTo(px,py); }
      x.strokeStyle = `rgba(111,201,255,${alpha*.18})`; x.lineWidth = 10*dpr; x.stroke();
      x.strokeStyle = `rgba(200,250,245,${alpha*.95})`; x.lineWidth = 2*dpr; x.stroke();
    }
    x.globalCompositeOperation = 'lighter';
    // head spark emits particles
    if (head <= 1){
      const u = (head*beats)%1, hx = head*W, hy = mid - ecg(u)*amp*(1+unlocking*2);
      for (let k = 0; k < (reduce?0:3); k++) parts.push({x:hx, y:hy, vx:(Math.random()-.3)*1.6*dpr, vy:(Math.random()-.5)*1.6*dpr, l:1, warm: Math.random()<.25});
      const g = x.createRadialGradient(hx,hy,0,hx,hy,60*dpr);
      g.addColorStop(0,'rgba(255,240,200,.9)'); g.addColorStop(.2,'rgba(159,232,228,.35)'); g.addColorStop(1,'rgba(0,0,0,0)');
      x.fillStyle = g; x.beginPath(); x.arc(hx,hy,60*dpr,0,6.28); x.fill();
    }
    // particles drift toward the centre — the light gathers
    const cx = W/2, cy = H*0.36;
    for (let i = parts.length-1; i >= 0; i--){
      const p = parts[i];
      const dx = cx - p.x, dy = cy - p.y, d = Math.hypot(dx,dy) + 1;
      p.vx += dx/d * .03*dpr*(1+unlocking*6); p.vy += dy/d * .03*dpr*(1+unlocking*6);
      const mx = p.x - mouse.x, my = p.y - mouse.y, md = Math.hypot(mx,my);
      if (md < 120*dpr){ p.vx += mx/md*.4; p.vy += my/md*.4; }
      p.vx *= .985; p.vy *= .985; p.x += p.vx; p.y += p.vy; p.l -= .006;
      if (p.l <= 0 || d < 6*dpr){ parts.splice(i,1); continue; }
      x.fillStyle = p.warm ? `rgba(255,210,122,${p.l*.8})` : `rgba(159,232,228,${p.l*.7})`;
      x.fillRect(p.x, p.y, 1.6*dpr, 1.6*dpr);
    }
    // soft halo where light gathers
    const pulse = .5 + .5*Math.sin(t*2.2);
    const halo = x.createRadialGradient(cx,cy,0,cx,cy,(220+unlocking*900)*dpr);
    halo.addColorStop(0,`rgba(255,226,160,${.10+.06*pulse+unlocking*.5})`);
    halo.addColorStop(.5,`rgba(111,201,255,${.04+unlocking*.2})`);
    halo.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle = halo; x.beginPath(); x.arc(cx,cy,(220+unlocking*900)*dpr,0,6.28); x.fill();

    if (parts.length > 1400) parts.splice(0, parts.length-1400);
    if (unlocking) unlocking = Math.min(1, unlocking + .012);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  setTimeout(() => document.getElementById('stack').classList.add('on'), reduce ? 0 : 900);

  const f = document.getElementById('f'), inp = document.getElementById('code'), msg = document.getElementById('msg');
  f.addEventListener('submit', e => {
    e.preventDefault();
    const v = inp.value.trim().toUpperCase();
    if (v === 'LUZ2026' || v === 'SNOWFLAKE'){
      msg.style.color = '#9fe8e4'; msg.textContent = 'Acesso concedido.';
      unlocking = .01;
      setTimeout(() => document.getElementById('flash').classList.add('go'), 900);
      setTimeout(() => location.href = 'valor.html', 1800);
    } else {
      msg.style.color = ''; msg.textContent = 'Código inválido. Verifique o código e tente novamente.';
      f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
    }
  });
  inp.focus();
})();
</script>
</body>
</html>
